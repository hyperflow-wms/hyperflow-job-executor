# Tests every change. A published release publishes the package to npm with
# the version in its tag (package.json holds 0.0.0-dev); a manual run only
# rehearses with npm publish --dry-run. See "Releasing" in the README.
#
# Publishing uses npm trusted publishing, so there is no npm token anywhere.
# npmjs.com must list this repository and this workflow file as the package's
# trusted publisher; if that entry is edited, publishing here stops working.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The versions this actually runs on: soykb-worker is node 18, the
        # 1000genome and Montage workers are node 20. Testing only on a newer
        # release would validate an environment no worker uses.
        node-version: [ '18', '20' ]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No install step: connector.test.js reaches only connector.js and
      # consoleLogger.js, neither of which requires a dependency.
      - name: Completion-transport tests
        run: node tests/connector.test.js

  publish:
    needs: [ test ]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    # Releases publish one at a time. Manual runs queue in their own group, so
    # they never cancel a waiting release.
    concurrency:
      group: publish-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets npm exchange a GitHub OIDC identity for publish rights. This is
      # what replaces a stored npm token; see "Releasing" in the README.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Publishing is tooling, so this tracks a current node rather than the
      # node the workers run. It ships an npm new enough to publish over OIDC,
      # which needs 11.5.1; node 20 ships npm 10 and cannot install a current
      # npm at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm is new enough to publish via OIDC
        run: |
          node -e '
            const v = require("child_process").execSync("npm --version").toString().trim();
            const [a, b, c] = v.split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm " + v + " cannot use trusted publishing, need 11.5.1 or newer");
              process.exit(1);
            }
            console.log("npm " + v + " supports trusted publishing");
          '

      # The tag is v followed by the exact version npm writes, with a -suffix
      # for a prerelease, which must also be marked as a prerelease on GitHub.
      # The tagged commit must be on master.
      - name: Set the version from the release tag
        if: github.event_name == 'release'
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          [[ "$GITHUB_REF_NAME" == v* ]] || { echo "not a release tag: $GITHUB_REF_NAME" >&2; exit 1; }
          case "$GITHUB_REF_NAME" in *-*) want=true ;; *) want=false ;; esac
          [ "$PRERELEASE" = "$want" ] \
            || { echo "$GITHUB_REF_NAME needs prerelease=$want, the release has $PRERELEASE" >&2; exit 1; }
          git fetch --no-tags origin refs/heads/master
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "$GITHUB_SHA is not on master" >&2; exit 1; }
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          [ "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}" ] \
            || { echo "not a release tag: $GITHUB_REF_NAME" >&2; exit 1; }

      # No token: npm authenticates through the OIDC identity granted above, and
      # attaches a provenance attestation automatically. A prerelease goes out
      # under the "next" dist-tag (npm 11 requires a tag for it), a stable
      # version under npm's default "latest". Only a release publishes; a manual
      # run adds --dry-run. npm refuses a version that is already published.
      - name: Publish
        run: |
          v=$(node -p "require('./package.json').version")
          flags=()
          case "$v" in *-*) flags+=(--tag next) ;; esac
          [ "$GITHUB_EVENT_NAME" = release ] || flags+=(--dry-run)
          npm publish "${flags[@]}"
